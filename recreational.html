<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO-VI - Actividades Obligatorias</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-grid">

        <!-- 1. BARRA IZQUIERDA DE DATOS (Intacta y reciclada) -->
        <aside id="panel-datos-izquierda" class="sidebar-datos">
            <div id="card-name" class="info-box">
                <h3>NAME</h3>
                <p id="astronauta-nombre">Cmdt. Alex Rivera</p>
            </div>

            <div id="card-personal-data" class="info-box">
                <h3>PERSONAL DATA</h3>
                <ul>
                    <li>Edad: <span id="dato-edad">34</span> años</li>
                    <li>Sexo: <span id="dato-sexo">F</span></li>
                    <li>Tipo Sangre: <span id="dato-sangre">O+</span></li>
                </ul>
            </div>

            <div id="card-mission-data" class="info-box">
                <h3>MISSION DATA</h3>
                <ul>
                    <li>Misión: <span id="dato-mision">Artemis / Marte</span></li>
                    <li>Días en órbita: <span id="dato-dias">45</span></li>
                    <li>Días seguros rest.: <span id="dato-dias-seguros">135</span></li>
                </ul>
            </div>
        </aside>

      <!-- 2. ZONA CENTRAL/DERECHA REEMPLAZADA POR LA LISTA DE ACTIVIDADES -->
        <section class="activities-wrapper">
            <h2 class="activities-main-title">MANDATORY HEALTH ACTIVITIES</h2>
            
            <div id="actividades-recreativas" class="activities-scroll-container">
                

            </div>
        </section>

    </main>

    <!-- 3. BARRA INFERIOR DE NAVEGACIÓN (Intacta y enlazada) -->
    <footer id="barra-inferior" class="bottom-nav">
        <button id="btn-exit" class="nav-btn btn-exit">SALIR</button>
        <button id="btn-inicio" class="nav-btn" onclick="window.location.href='main.html'">INICIO</button>
        <button id="btn-recreativas" class="nav-btn" onclick="window.location.href='recreational.html'">ACTIVIDADES RECREATIVAS</button>
        <button id="btn-obligatorias" class="nav-btn" onclick="window.location.href='health.html'">ACTIVIDADES OBLIGATORIAS</button>
        
    </footer>
    
    <aside id="panel-notificaciones" class="panel-notificaciones">
        <h3 id="panel-titulo">Notificaciones</h3>
    </aside>

    <script src="js/main.js"></script>
</body>
</html>
