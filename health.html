<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO-VI | Health Activities</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">

    <main class="main-grid">
        <aside id="panel-datos-izquierda" class="sidebar-datos">
            <div id="card-name" class="info-box">
                <h3>NAME</h3>
                <p id="astronauta-nombre">Cmdt. Alex Rivera</p>
            </div>

            <div id="card-personal-data" class="info-box">
                <h3>PERSONAL DATA</h3>
                <ul>
                    <li>Edad: <span id="dato-edad">34</span> años</li>
                    <li>Sexo: <span id="dato-sexo">F</span></li>
                    <li>Tipo Sangre: <span id="dato-sangre">O+</span></li>
                </ul>
            </div>

            <div id="card-mission-data" class="info-box">
                <h3>MISSION DATA</h3>
                <ul>
                    <li>Misión: <span id="dato-mision">Artemis / Marte</span></li>
                    <li>Días en órbita: <span id="dato-dias">45</span></li>
                    <li>Días seguros rest.: <span id="dato-dias-seguros">135</span></li>
                </ul>
            </div>
        </aside>

        <section class="health-layout">
            <div class="activities-wrapper">
                <h2 class="activities-main-title">MANDATORY HEALTH ACTIVITIES</h2>

                <div id="activities-scroll-container" class="activities-scroll-container">

                </div>
            </div> 

            <aside class="categories-sidebar">
                <button class="category-item active" onclick="gestionarCategorias('ejercicio')">Actividad Física</button>
                <button class="category-item" onclick="gestionarCategorias('animo')">Registro de ánimo</button>
                <button class="category-item" onclick="gestionarCategorias('alimentacion')">Registro de alimentación</button>
                <button class="category-item" onclick="gestionarCategorias('hidratacion')">Registro de hidratación</button>
            </aside>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn btn-exit" onclick="window.location.href='login.html'">SALIR</button>
        <button class="nav-btn" onclick="window.location.href='main.html'">INICIO</button>
        <button class="nav-btn" onclick="window.location.href='recreational.html'">ACTIVIDADES RECREATIVAS</button>
        <button class="nav-btn" onclick="window.location.href='health.html'">ACTIVIDADES OBLIGATORIAS</button>
    </nav>

    <script src="js/main.js"></script>
</body>
</html>
