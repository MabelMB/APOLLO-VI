<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO-VI - Panel de Monitoreo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">

    <!-- CONTENEDOR PRINCIPAL DE LAS 3 COLUMNAS -->
    <main class="main-grid">

        <!-- 1. BARRA IZQUIERDA DE DATOS -->
        <aside id="panel-datos-izquierda" class="sidebar-datos">
        </aside>

        <!-- 2. ESPACIO CENTRAL PARA LA IMAGEN DEL CUERPO HUMANO Y SUS CAPAS -->
        <section id="panel-cuerpo-central" class="cuerpo-container">
            <div id="mapa-corporal" class="avatar-wrapper">
                <img src="img/maleBase.png" alt="Figura del cuerpo humano" id="img-cuerpo">
                <img alt="" id="img-cabeza" class="img-detalle">
                <img alt="" id="img-torax" class="img-detalle">
                <img alt="" id="img-abdomen" class="img-detalle">
            </div>
        </section>

        <!-- 3. TERCER ESPACIO (DERECHA): TABLA DE SISTEMAS -->
        <section id="panel-metricas-derecha" class="metricas-container">
            <div class="tabla-sistemas">

                <div class="fila-sistema" id="sistema-sueno">
                    <div class="sistema-titulo">
                        <strong>Sueño</strong>
                    </div>
                </div>

                <div class="fila-sistema" id="sistema-corazon">
                    <div class="sistema-titulo">
                        <strong>Corazón</strong>
                    </div>
                </div>

                <div class="fila-sistema" id="sistema-oseo">
                    <div class="sistema-titulo">
                        <strong>Óseo</strong>
                    </div>
                </div>

                <div class="fila-sistema" id="sistema-radiacion">
                    <div class="sistema-titulo">
                        <strong>Radiación</strong>
                    </div>
                </div>

                <div class="fila-sistema" id="sistema-musculos">
                    <div class="sistema-titulo">
                        <strong>Músculos</strong>
                    </div>
                </div>

                <div class="fila-sistema" id="sistema-metabolismo">
                    <div class="sistema-titulo">
                        <strong>Metabolismo</strong>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- 4. BARRA INFERIOR DE NAVEGACIÓN -->
    <footer id="barra-inferior" class="bottom-nav">
        <button class="nav-btn btn-exit" onclick="window.location.href='login.html'">SALIR</button>
        <button class="nav-btn" onclick="window.location.href='main.html'">INICIO</button>
        <button class="nav-btn" onclick="window.location.href='recreational.html'">ACTIVIDADES RECREATIVAS</button>
        <button class="nav-btn" onclick="window.location.href='health.html'">ACTIVIDADES OBLIGATORIAS</button>
    </footer>


<!-- 5. RECUADRO LATERAL DERECHO DESPLEGABLE CON SCROLL -->
    <aside id="panel-notificaciones" class="panel-notificaciones">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0;">
            <h3 id="panel-titulo" style="color: #38bdf8; letter-spacing: 1.5px; font-size: 0.9rem;">DETALLE</h3>
            <button onclick="cerrarPanel()" style="background: transparent; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">&times;</button>
        </div>
        <!-- Contenedor con scroll integrado -->
        <div id="contenido-panel-dinamico" class="activities-scroll-container">
            <!-- Contenido dinámico -->
        </div>
    </aside>
