<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOLLO-VI - Inicio De Sesión</title>

    <!-- Enlace - carpeta css -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

    <main class="login-main-container">
        <div class="login-card">
            <h1 class="login-title">APOLLO-VI</h1>
            <p class="login-subtitle">Monitoreo de Salud de Astronautas</p>

            <form id="form-login" class="login-form" action="php/login.php" method="POST" autocomplete="off">
                <div class="search-wrapper">
                    <input type="number" id="input-clave" class="apollo-input" name="clave" placeholder="clave de busqueda" required>
                    
                    <!-- Lista de coincidencias con clases de componentes -->
                    <ul id="lista-coincidencias" class="apollo-dropdown"></ul>
                </div>

                <button type="submit" id="btn-login" class="apollo-btn" disabled>Ingresar al sistema</button>
            </form>

            <div id="contenedor-alertas"></div>
        </div>
    </main>

    <!-- Enlace - script de JS -->
    <script src="js/main.js"></script>
</body>
</html>
